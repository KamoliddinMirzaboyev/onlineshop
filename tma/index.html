<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#16A34A" />
    <title>Barakali Bozor</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="dns-prefetch" href="https://api.barakali-bozor.uz" />
    <link rel="preconnect" href="https://api.barakali-bozor.uz" crossorigin />
    <link rel="preconnect" href="https://telegram.org" />
    <!--
      initData erta capture: Telegram #tgWebAppData hash ni ba'zi WebView/redirect
      da yo'qotadi. SDK va SPA yuklanishidan OLDIN sessionStorage ga yozamiz.
    -->
    <script>
      (function () {
        try {
          var raw = (location.hash || "").replace(/^#/, "") || (location.search || "").replace(/^\?/, "");
          if (!raw || raw.indexOf("tgWebAppData") < 0) return;
          var data = new URLSearchParams(raw).get("tgWebAppData");
          if (data) sessionStorage.setItem("__af_tgWebAppData", data);
        } catch (e) {}
      })();
    </script>
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
